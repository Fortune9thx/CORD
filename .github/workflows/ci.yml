name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract:
    name: Contract — lint, bundle, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install pytest "ruff==0.16.9" genvm-linter

      - name: Lint
        run: ruff check contracts tests

      - name: Build the single deployable file
        run: python3 contracts/build_bundle.py

      - name: Fail if the committed bundle is stale
        run: |
          git diff --exit-code -- contracts/build/Cord.bundled.py \
            || { echo "::error::contracts/build/Cord.bundled.py is out of date; run python3 contracts/build_bundle.py"; exit 1; }

      - name: Tests
        run: python3 -m pytest tests/ -q

      # Full GenVM validation against the pinned runner is a hard gate. The
      # Depends pin (py-genlayer:5jycge4q...) is carried by the genvm-manager
      # bundles through v0.6.0-rc9; v0.6.0-rc10 dropped it, so the manager
      # version is pinned to the newest bundle that still ships it. A failed
      # download, lint or validation blocks the build -- it cannot fail
      # silently. PYTHONIOENCODING stops genvm-lint dying while writing its
      # own check mark on a non-UTF-8 console.
      - name: Pre-download the pinned GenVM runner bundle
        env:
          PYTHONIOENCODING: utf-8
          GENVM_VERSION: v0.6.0-rc9
          GENVM_ALLOW_PRERELEASE: "1"
        run: genvm-lint download -v "$GENVM_VERSION"

      - name: Contract safety lint
        env:
          PYTHONIOENCODING: utf-8
        run: genvm-lint lint contracts/build/Cord.bundled.py

      - name: Contract validation against the pinned runner (blocking)
        env:
          PYTHONIOENCODING: utf-8
          GENVM_VERSION: v0.6.0-rc9
          GENVM_ALLOW_PRERELEASE: "1"
        run: genvm-lint check contracts/build/Cord.bundled.py

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
